name: Feature request
description: Suggest a new behavior or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: You can write in English or Traditional Chinese.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      description: How do you want Speclink to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds that you tried.
