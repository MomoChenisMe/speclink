name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tauri crates joined the workspace — Linux builds need the GTK/WebKit stack.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Smoke only needs the CLI; the full workspace compiles once via cargo test below.
      - name: Build (release)
        run: cargo build --release --locked -p speclink-cli

      - name: Smoke test (init → new → artifact → status → validate)
        shell: bash
        run: |
          BIN="$PWD/target/release/speclink"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          mkdir smoke && cd smoke
          git init -q
          git config user.name CI
          git config user.email ci@example.com
          "$BIN" init . --tools claude,codex
          test -f CLAUDE.md && test -f AGENTS.md && test -f .claude/skills/speclink-propose/SKILL.md
          "$BIN" new change smoke-test --agent claude
          printf '## Why\nSmoke test\n## Impact\n- none\n' | "$BIN" new artifact proposal --change smoke-test --stdin
          "$BIN" status --change smoke-test
          "$BIN" validate smoke-test
          "$BIN" list
          "$BIN" schemas
          "$BIN" update

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies (root workspaces)
        run: npm ci

      # tauri::generate_context! embeds frontendDist at compile time — dist must
      # exist before any cargo build of the desktop crate.
      - name: Build desktop frontend (vite → dist)
        run: npm run build -w apps/desktop

      - name: Test (Rust workspace)
        run: cargo test --workspace --locked

      - name: Test (UI)
        run: npm test -w packages/ui

      - name: Test (Desktop)
        run: npm test -w apps/desktop

  # The PostgreSQL driver needs a real database, which `services` can only give
  # a Linux runner — hence a job of its own rather than a step in the matrix
  # above. There, with no SPECLINK_TEST_POSTGRES_URL set, those suites report
  # `skipped` and the matrix stays green on machines without a database.
  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The supported floor. The driver uses nothing newer, and the floor is
        # what CI must prove, so this pins the version rather than tracking
        # latest.
        image: postgres:15
        env:
          POSTGRES_PASSWORD: speclink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPECLINK_TEST_POSTGRES_URL: postgres://postgres:speclink@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (postgres driver, and the server over it)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p speclink-store-postgres 2>&1 | tee postgres-suites.log
          cargo test --locked -p speclink-server --test postgres_store 2>&1 | tee -a postgres-suites.log

      # The suites skip rather than fail when no database is configured — right
      # on a developer's laptop, useless here. Without this, a typo in the URL
      # or a service that never came up would leave this job green having run
      # nothing at all.
      - name: Guard — the suites must have actually run
        shell: bash
        run: |
          if grep -q 'skipped' postgres-suites.log; then
            echo "::error::the PostgreSQL suites reported skipped — the service or SPECLINK_TEST_POSTGRES_URL never reached them, so nothing was tested"
            exit 1
          fi
