name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tauri crates joined the workspace — Linux builds need the GTK/WebKit stack.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Smoke only needs the CLI; the full workspace compiles once via cargo test below.
      - name: Build (release)
        run: cargo build --release --locked -p speclink-cli

      - name: Smoke test (init → new → artifact → status → validate)
        shell: bash
        run: |
          BIN="$PWD/target/release/speclink"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          mkdir smoke && cd smoke
          git init -q
          git config user.name CI
          git config user.email ci@example.com
          "$BIN" init . --tools claude,codex
          test -f CLAUDE.md && test -f AGENTS.md && test -f .claude/skills/speclink-propose/SKILL.md
          "$BIN" new change smoke-test --agent claude
          printf '## Why\nSmoke test\n## Impact\n- none\n' | "$BIN" new artifact proposal --change smoke-test --stdin
          "$BIN" status --change smoke-test
          "$BIN" validate smoke-test
          "$BIN" list
          "$BIN" schemas
          "$BIN" update

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies (root workspaces)
        run: npm ci

      # tauri::generate_context! embeds frontendDist at compile time — dist must
      # exist before any cargo build of the desktop crate.
      - name: Build desktop frontend (vite → dist)
        run: npm run build -w apps/desktop

      - name: Test (Rust workspace)
        run: cargo test --workspace --locked

      - name: Test (UI)
        run: npm test -w packages/ui

      - name: Test (Desktop)
        run: npm test -w apps/desktop

  # Phase 3 收官劇本獨立計時、獨立失敗現場；不藏在 workspace 單元測試裡。
  phase3-e2e:
    runs-on: ubuntu-latest
    env:
      PHASE3_E2E_ARTIFACT_DIR: target/phase3-e2e-artifacts
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build desktop frontend
        run: |
          npm ci
          npm run build -w apps/desktop

      - name: Test Phase 3 continuous chain
        shell: bash
        run: |
          mkdir -p "$PHASE3_E2E_ARTIFACT_DIR"
          set -o pipefail
          cargo test --locked -p speclink-desktop --test phase3_chain -- --nocapture 2>&1 \
            | tee "$PHASE3_E2E_ARTIFACT_DIR/test-output.log"

      - name: Upload Phase 3 failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase3-e2e-failure-${{ runner.os }}
          path: target/phase3-e2e-artifacts/
          if-no-files-found: warn

  # Docker 冒煙（server-release spec）：映像 build 得起來只是下限——起得來、
  # /healthz 與 /readyz 皆 2xx、logs 印 setup token、壞組態 fail closed 以非零
  # exit code 結束，四件事都驗到才算。兩份 compose 檔的語法驗證也掛在這裡。
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f crates/speclink-server/Dockerfile -t speclink-server:smoke .

      - name: Compose 檔語法驗證
        env:
          # postgres compose 對缺密碼設計成大聲失敗（${VAR:?}），語法驗證給假值通過。
          SPECLINK_POSTGRES_PASSWORD: ci-syntax-check-only
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.postgres.yml config --quiet

      # 語法過不代表起得來，這一步驗真正的 compose 路徑。
      #
      # --build 是必要的，不是保險：compose 對 image: 是「先 pull、失敗才 build」。
      # 今天 ghcr 上還沒有 :latest（pull 403 → 回退建置）所以看起來會過，但首次
      # 正式發版推出 :latest 的那天，這一步會改拉已發布映像、不再建置本 commit 的
      # 原始碼——測的東西被無聲掉包。--build 讓它永遠建置受測原始碼。
      - name: 冒煙 — SQLite compose 一行開箱
        shell: bash
        working-directory: deploy
        run: |
          docker compose up -d --build
          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/readyz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::compose 起的 server 未在 60 秒內就緒"
            docker compose logs
            exit 1
          fi
          if ! docker compose logs server | grep -Eq 'setup\?token=[A-Za-z0-9_]+'; then
            echo "::error::compose logs 沒有一次性 setup token 行"
            docker compose logs
            exit 1
          fi
          docker compose down -v

      - name: 冒煙 — 起容器（SQLite 組態）→ /healthz、/readyz → setup token 行
        shell: bash
        run: |
          docker run -d --name smoke -p 8080:8080 speclink-server:smoke
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz \
               && curl -fsS -o /dev/null http://127.0.0.1:8080/readyz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::/healthz 或 /readyz 未在 30 秒內回 2xx"
            docker logs smoke
            exit 1
          fi
          if ! docker logs smoke | grep -Eq 'setup\?token=[A-Za-z0-9_]+'; then
            echo "::error::logs 沒有一次性 setup token 行"
            docker logs smoke
            exit 1
          fi
          docker stop smoke

      # spec 的 THEN 有兩句：非零 exit code「且」不綁定連接埠。後者在容器退出後
      # 無法用 curl 觀察——埠映射隨容器一起拆掉，那種斷言恆真、是假覆蓋。改以
      # 啟動順序的可觀察代理來驗：main.rs 的順序是 config → store → identity →
      # setup token → bind，所以「死在 config 階段」＋「沒印出 token 行」即證明
      # 執行從未走到 bind。
      - name: 壞組態容器即死（fail closed，且未走到 bind）
        shell: bash
        run: |
          printf 'store: [unclosed\n' > bad-config.yaml
          docker run -d --name badcfg \
            -v "$PWD/bad-config.yaml:/etc/speclink/config.yaml:ro" speclink-server:smoke
          for _ in $(seq 1 15); do
            st=$(docker inspect -f '{{.State.Status}}' badcfg)
            [ "$st" = "exited" ] && break
            sleep 1
          done
          if [ "$(docker inspect -f '{{.State.Status}}' badcfg)" != "exited" ]; then
            echo "::error::壞組態容器 15 秒內未退出——啟動守門失效"
            docker logs badcfg
            exit 1
          fi
          rc=$(docker inspect -f '{{.State.ExitCode}}' badcfg)
          docker logs badcfg || true
          if [ "$rc" -eq 0 ]; then
            echo "::error::壞組態容器以 0 退出——fail closed 失效"
            exit 1
          fi
          if ! docker logs badcfg 2>&1 | grep -q 'cannot parse config file'; then
            echo "::error::非零退出但不是因為組態解析失敗——守門的把關點跑掉了"
            exit 1
          fi
          if docker logs badcfg 2>&1 | grep -q 'setup?token='; then
            echo "::error::壞組態下仍鑄出 setup token——執行走過了 config 守門"
            exit 1
          fi

  # The PostgreSQL driver needs a real database, which `services` can only give
  # a Linux runner — hence a job of its own rather than a step in the matrix
  # above. There, with no SPECLINK_TEST_POSTGRES_URL set, those suites report
  # `skipped` and the matrix stays green on machines without a database.
  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The supported floor. The driver uses nothing newer, and the floor is
        # what CI must prove, so this pins the version rather than tracking
        # latest.
        image: postgres:15
        env:
          POSTGRES_PASSWORD: speclink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPECLINK_TEST_POSTGRES_URL: postgres://postgres:speclink@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (postgres driver, and the server over it)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p speclink-store-postgres 2>&1 | tee postgres-suites.log
          cargo test --locked -p speclink-server --test postgres_store 2>&1 | tee -a postgres-suites.log

      # The suites skip rather than fail when no database is configured — right
      # on a developer's laptop, useless here. Without this, a typo in the URL
      # or a service that never came up would leave this job green having run
      # nothing at all.
      - name: Guard — the suites must have actually run
        shell: bash
        run: |
          if grep -q 'skipped' postgres-suites.log; then
            echo "::error::the PostgreSQL suites reported skipped — the service or SPECLINK_TEST_POSTGRES_URL never reached them, so nothing was tested"
            exit 1
          fi
