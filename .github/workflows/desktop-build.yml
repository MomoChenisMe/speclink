# 桌面安裝檔：手動建置，或 push desktop-vX.Y.Z／desktop-vX.Y.Z.N 自動建置並發布。
# 首次使用須先將此 workflow 合併到預設分支，才能顯示 Run workflow。
# macOS 使用 ad-hoc 簽章；不需發布私鑰，不產生 updater 更新包。
name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Wait for successful CI on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/desktop/desktop-ci-gate.mjs
      - name: Check desktop tag and source versions
        id: version
        run: node scripts/desktop/desktop-release-version.mjs

  desktop:
    needs: [prepare]
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            installer: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            installer: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          # 使用較舊的 glibc 基底，增加 Linux x64 使用端的相容性。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage
            installer: target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          # 公開 repository 可使用 GitHub 的 ARM64 runner。
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage
            installer: target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-build-${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf xdg-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop frontend
        run: npm run build -w apps/desktop

      - name: Use static Windows C runtime for desktop and CLI
        if: runner.os == 'Windows'
        run: echo 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"

      - name: Build same-source CLI sidecar
        run: node scripts/desktop/desktop-sidecar.mjs --target ${{ matrix.target }}

      - name: Prepare self-use bundle config and build information
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const config = { bundle: { createUpdaterArtifacts: false } };
          if (process.platform === 'darwin') {
            config.bundle.macOS = { signingIdentity: '-' };
          }
          writeFileSync('desktop-build-config.json', JSON.stringify(config));
          const app = JSON.parse(readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          console.log([
            `Repository: ${process.env.GITHUB_REPOSITORY}`,
            `Ref: ${process.env.GITHUB_REF}`,
            `Commit: ${process.env.GITHUB_SHA}`,
            `App version: ${app.version}`,
          ].join('\n'));
          NODE

      - name: Build desktop installer
        run: >-
          npm run -w apps/desktop tauri -- build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          --config "$GITHUB_WORKSPACE/desktop-build-config.json"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14

      - name: Package and check Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/desktop/windows-portable.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable staging failed' }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $folder = "target/x86_64-pc-windows-msvc/release/bundle/portable/Speclink_${version}_x64-portable"
          Compress-Archive -Path $folder -DestinationPath "$folder.zip" -Force
          $check = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          Expand-Archive -Path "$folder.zip" -DestinationPath $check
          $extracted = Join-Path $check "Speclink_${version}_x64-portable"
          if (!(Test-Path "$extracted/speclink-desktop.exe")) { throw 'Desktop executable missing' }
          & "$extracted/speclink.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Extracted portable CLI failed' }
          $config = & "$extracted/speclink.exe" config path
          if ($LASTEXITCODE -ne 0) { throw 'Portable config lookup failed' }
          $expected = Join-Path $extracted 'data/speclink/config.yaml'
          if ([IO.Path]::GetFullPath($config.Trim()) -ne [IO.Path]::GetFullPath($expected)) {
            throw 'Portable CLI is using a machine config directory'
          }
          & "$extracted/speclink.exe" config set locale English
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $expected)) { throw 'Portable config write failed' }
          $moved = Join-Path $check 'moved-portable'
          Move-Item -Path $extracted -Destination $moved
          $config = & "$moved/speclink.exe" config path
          if ($LASTEXITCODE -ne 0) { throw 'Moved portable config lookup failed' }
          $expected = Join-Path $moved 'data/speclink/config.yaml'
          if ([IO.Path]::GetFullPath($config.Trim()) -ne [IO.Path]::GetFullPath($expected)) {
            throw 'Portable config did not follow the relocated EXE'
          }
          $locale = & "$moved/speclink.exe" config get locale
          if ($LASTEXITCODE -ne 0 -or $locale.Trim() -ne 'English') { throw 'Moved portable config lost' }

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc-portable
          path: target/x86_64-pc-windows-msvc/release/bundle/portable/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Publish desktop release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Speclink Desktop ${{ needs.prepare.outputs.version }}
          make_latest: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          fail_on_unmatched_files: true
          body: |
            Desktop installers and Windows portable ZIP built from this tag.
            macOS: universal DMG; Windows: x64 installer or portable ZIP; Linux: choose amd64 or aarch64 AppImage.
            These builds have no publisher certificate and do not include signed updater packages or latest.json. Update manually.

            此 Tag 的桌面安裝檔與 Windows 免安裝 ZIP。
            macOS：通用 DMG；Windows：x64 安裝器或免安裝 ZIP；Linux：依架構選擇 amd64 或 aarch64 AppImage。
            此流程未使用發行者憑證，也不提供簽章更新包或 latest.json，請手動下載更新。
          files: |
            release/Speclink_${{ needs.prepare.outputs.version }}_universal.dmg
            release/Speclink_${{ needs.prepare.outputs.version }}_x64-setup.exe
            release/Speclink_${{ needs.prepare.outputs.version }}_amd64.AppImage
            release/Speclink_${{ needs.prepare.outputs.version }}_aarch64.AppImage
            release/Speclink_${{ needs.prepare.outputs.version }}_x64-portable.zip
