# 自用桌面安裝檔：手動選分支建置，產物只上傳到本次 Actions run。
# 首次使用須先將此 workflow 合併到預設分支，才能顯示 Run workflow。
# macOS 使用 ad-hoc 簽章；不需發布私鑰，不產生 updater 更新包。
name: Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            installer: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            installer: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          # 使用較舊的 glibc 基底，增加 Linux x64 使用端的相容性。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage
            installer: target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          # 公開 repository 可使用 GitHub 的 ARM64 runner。
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage
            installer: target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-build-${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf xdg-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop frontend
        run: npm run build -w apps/desktop

      - name: Build same-source CLI sidecar
        run: node scripts/desktop/desktop-sidecar.mjs --target ${{ matrix.target }}

      - name: Prepare self-use bundle config and build information
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const config = { bundle: { createUpdaterArtifacts: false } };
          if (process.platform === 'darwin') {
            config.bundle.macOS = { signingIdentity: '-' };
          }
          writeFileSync('desktop-build-config.json', JSON.stringify(config));
          const app = JSON.parse(readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          console.log([
            `Repository: ${process.env.GITHUB_REPOSITORY}`,
            `Ref: ${process.env.GITHUB_REF}`,
            `Commit: ${process.env.GITHUB_SHA}`,
            `App version: ${app.version}`,
          ].join('\n'));
          NODE

      - name: Build desktop installer
        run: >-
          npm run -w apps/desktop tauri -- build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          --config "$GITHUB_WORKSPACE/desktop-build-config.json"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
