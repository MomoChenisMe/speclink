name: Node SDK

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/node-sdk.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/node-sdk.yml'
  # 同檔雙角色（設計 D1）：push／PR 是 CI 驗證（無 version，佔位版號打包），
  # release.yml 以 workflow_call 帶 tag 版重用同一份 build/pack，蓋章後的
  # npm-tarballs artifact 因屬同一 workflow run 而能被 caller 的後續 job 下載。
  workflow_call:
    inputs:
      version:
        description: '發布版號（X.Y.Z，不帶 v 前綴）；留空則以 repo 內佔位版號打包'
        required: false
        type: string

defaults:
  run:
    working-directory: crates/speclink-node

jobs:
  build:
    name: build ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - host: macos-latest
            target: x86_64-apple-darwin
            test: false # macos-latest runners are arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            test: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            test: false # cross-compiled, not runnable on the x64 host
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross toolchain
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Build native module (release)
        run: npm run build:release -- --target ${{ matrix.settings.target }}

      # engine.spec 的 CLI parity 測試需要 speclink binary；與 napi release build 共用編譯產物。
      - name: Build the CLI for parity tests (release)
        if: matrix.settings.test
        working-directory: .
        run: cargo build --release -p speclink-cli --locked

      - name: Test against the native-arch build
        if: matrix.settings.test
        run: npm test

      - name: Upload platform binary
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/speclink-node/*.node
          if-no-files-found: error

      # binding.js 是 napi build 產生的 loader，被 .gitignore 忽略，但主套件的
      # files 列了它——pack job 不重新建置，所以這裡帶一份出去。它只依 platform／
      # arch 分派、與 target 無關，因此固定從一個 target 上傳一份即可。
      - name: Upload the generated JS loader
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: binding-js
          path: crates/speclink-node/binding.js
          if-no-files-found: error

  package:
    name: package npm tarballs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Create platform sub-package directories
        run: npx napi create-npm-dir -t .

      # pattern 圈定：被 release.yml 以 workflow_call 重用時，本 job 與 caller 屬
      # 同一個 run，不圈定會把 server-*／desktop-* 等 artifact 一起灌進 napi 的
      # 掃描目錄。
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: crates/speclink-node/artifacts

      - name: Distribute binaries into sub-packages
        run: npx napi artifacts

      # binding.js 只由 napi build 產生、不在 repo 內，而主套件的 files 列了它：
      # 少了它 npm pack 會靜默略過，發出去的套件一 require 就 MODULE_NOT_FOUND。
      - name: Restore the generated JS loader
        uses: actions/download-artifact@v4
        with:
          name: binding-js
          path: crates/speclink-node

      # 版號蓋章（設計 D2）：只在 workflow_call 帶 version 時執行，把 tag 版寫進主
      # 套件與全部平台子套件並物化 optionalDependencies。push／PR 無此輸入即跳過，
      # 打包行為與導入 workflow_call 前完全一致。版號經 env 傳入而非內插進 run:
      # ——tag 名可含引號與分號，內插等於把 tag 名當 shell 原始碼跑。
      - name: Stamp the release version onto the package family
        if: inputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/npm-engine-package.mjs --version "$VERSION" --dir crates/speclink-node

      - name: Pack the main package and every platform sub-package
        run: |
          npm pack
          for dir in npm/*/; do
            (cd "$dir" && npm pack)
          done
          ls -l ./*.tgz npm/*/*.tgz
          # fail closed：主套件少了 binding.js 照樣打包成功，但裝起來是壞的。
          main_tgz="$(ls ./*.tgz)"
          tar -tzf "$main_tgz" | grep -qx 'package/binding.js' \
            || { echo "::error::主套件 tarball 缺 binding.js（loader 未取回）"; exit 1; }
          # 同一道保險要對稱：napi artifacts 找不到相符檔名時是靜默 return，
          # 少了這裡就會打包出「只有 package.json」的子套件，全綠發上 npm。
          for tgz in npm/*/*.tgz; do
            tar -tzf "$tgz" | grep -q '\.node$' \
              || { echo "::error::子套件 tarball $tgz 缺 .node（napi artifacts 沒分配到二進位）"; exit 1; }
          done

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: |
            crates/speclink-node/*.tgz
            crates/speclink-node/npm/*/*.tgz
          if-no-files-found: error
