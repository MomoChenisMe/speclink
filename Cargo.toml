[workspace]
resolver = "2"
members = ["crates/speclink-core", "crates/speclink-fs", "crates/speclink-remote", "crates/speclink-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
