[workspace]
resolver = "2"
members = ["crates/engine/speclink-core", "crates/engine/speclink-fs", "crates/protocol/speclink-protocol", "crates/protocol/speclink-remote", "crates/adapters/speclink-cli", "crates/adapters/speclink-node", "crates/store/speclink-store", "crates/store/speclink-store-sqlite", "crates/store/speclink-store-fs", "crates/store/speclink-store-postgres", "crates/host/speclink-host", "crates/host/speclink-server", "apps/desktop/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ulid = "1.2"
