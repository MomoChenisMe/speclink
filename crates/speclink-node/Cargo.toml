[package]
name = "speclink-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# The cdylib only loads inside Node (napi symbols come from the host runtime);
# its behavior is tested by `npm test` — cargo's test harness cannot host it.
test = false
doctest = false

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi5", "serde-json"] }
napi-derive = "2.16"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
speclink-core = { path = "../speclink-core" }
speclink-fs = { path = "../speclink-fs" }
speclink-host = { path = "../speclink-host" }

[build-dependencies]
napi-build = "2"
