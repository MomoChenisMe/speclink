[package]
name = "speclink-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical Rust Host application layer: ExecutionContext, binding fail-closed validation, policy injection, lifecycle gate, TeamStore composition"

[dependencies]
speclink-core = { path = "../../engine/speclink-core" }
speclink-protocol = { path = "../../protocol/speclink-protocol" }
speclink-store = { path = "../../store/speclink-store" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
chrono.workspace = true
sys-locale = "0.3.2"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
ulid.workspace = true
webpki-roots = "0.26.11"
url = "2"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
hyper-util = { version = "0.1.20", features = ["client-proxy", "client-proxy-system"] }

[dev-dependencies]
speclink-fs = { path = "../../engine/speclink-fs" }
tempfile = "3"
