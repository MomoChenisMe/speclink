[package]
name = "speclink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "speclink"
path = "src/main.rs"

[dependencies]
speclink-core = { path = "../speclink-core" }
speclink-fs = { path = "../speclink-fs" }
speclink-host = { path = "../speclink-host" }
speclink-protocol = { path = "../speclink-protocol" }
speclink-remote = { path = "../speclink-remote" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete = "4"

[dev-dependencies]
# 測試借 core 的 testkit（技能檔版號讀寫 helper）；feature 只在 dev 構建生效。
speclink-core = { path = "../speclink-core", features = ["testkit"] }
tiny_http = "0.12"
chrono.workspace = true
