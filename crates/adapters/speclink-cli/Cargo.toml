[package]
name = "speclink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "speclink"
path = "src/main.rs"

[dependencies]
speclink-core = { path = "../../engine/speclink-core" }
speclink-fs = { path = "../../engine/speclink-fs" }
speclink-host = { path = "../../host/speclink-host" }
speclink-protocol = { path = "../../protocol/speclink-protocol" }
speclink-remote = { path = "../../protocol/speclink-remote" }
speclink-verbs = { path = "../speclink-verbs" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete = "4"
# The skill version notice is told once a local calendar day.
chrono.workspace = true

[dev-dependencies]
# 測試借 core 的 testkit（技能檔版號讀寫 helper）；feature 只在 dev 構建生效。
speclink-core = { path = "../../engine/speclink-core", features = ["testkit"] }
tiny_http = "0.12"
# The remote-read tests run the real HTTP door on the in-memory store port.
speclink-store-port = { path = "../../store/speclink-store-port" }
