schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Product: a browser-based pinball game shipped as a single self-contained HTML file.
  Tech stack: HTML5 Canvas 2D, vanilla JavaScript (inline, no modules bundler), CSS. No build step, no external dependencies, no frameworks.
  Physics: simple 2D rigid body — gravity, per-frame velocity integration, and collision with walls, flippers and bumpers using restitution.
  Controls: left/right flippers on ArrowLeft/ArrowRight (also A/L), ball launch on Space.
  Loop: fixed-timestep update driven by requestAnimationFrame, targeting 60fps.
  Layout: everything lives in pinball/index.html at the project root.
  Domain: casual arcade game — score, remaining balls, game over, restart.

# Per-artifact rules (optional)
rules:
  proposal:
    - Keep the proposal focused on player-facing behavior, not rendering internals
    - Always list the physics and input capabilities explicitly
  design:
    - Record physics constants (gravity, restitution, flipper torque) with concrete numeric values and units
    - State the collision-detection approach per object type (walls, flippers, bumpers) and why
    - Keep everything inside a single-file constraint — no design may introduce a build step or external asset
  specs:
    - Every scenario's WHEN/THEN must use observable game state (score, ball position, lives), never internal variable names
    - Requirements about input must cover both primary keys (ArrowLeft/ArrowRight/Space) and alternate keys (A/L)
    - Timing-sensitive behavior must state the expectation in frames or milliseconds at the 60fps baseline
  tasks:
    - Each task must name the concrete function or game-loop phase it implements
    - Include a manual verification step describing what to click or observe in the browser
