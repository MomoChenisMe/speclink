<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Bomberman</title>
<style>
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center;
         font-family: monospace; color: #eee; }
  canvas { border: 2px solid #444; margin-top: 12px; background: #2e7d32; }
  p { color: #9e9e9e; }
</style>
</head>
<body>
<canvas id="game" width="600" height="560"></canvas>
<p>方向鍵移動 · Space 放彈 · P 暫停 · R 重開</p>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var COLS = 15, ROWS = 13, TILE = 40, HUD_H = 40;
  var EMPTY = 0, HARD = 1, SOFT = 2;
  var PLAYER_SPEED = 3, PLAYER_HALF = 13;
  var ENEMY_SPEED = 1.5, ENEMY_HALF = 13, ENEMY_COUNT = 4, ENEMY_MIN_DIST = 6;
  var BOMB_FUSE = 150, BLAST_FRAMES = 24;
  var SOFT_DENSITY = 0.55, DROP_RATE = 0.3;
  var START_LIVES = 3, START_CAP = 1, START_RANGE = 2;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng ----------
  var seedState = 1;
  function srand(s) { seedState = (s >>> 0) || 1; }
  function rng() {
    seedState = (Math.imul(seedState, 1664525) + 1013904223) >>> 0;
    return seedState / 4294967296;
  }

  // ---------- state ----------
  var grid, player, bombs, blasts, enemies, powerups;
  var lives, bombCap, range, phase; // phase: playing | paused | gameover | victory
  var keys = {};

  function tileCenter(col, row) { return { x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 }; }
  function tileOf(x, y) { return { col: Math.floor(x / TILE), row: Math.floor(y / TILE) }; }
  function manhattan(c, r) { return Math.abs(c - 1) + Math.abs(r - 1); }

  function buildGrid() {
    grid = [];
    for (var r = 0; r < ROWS; r++) {
      grid.push([]);
      for (var c = 0; c < COLS; c++) {
        var hard = r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 ||
                   (r % 2 === 0 && c % 2 === 0);
        grid[r].push(hard ? HARD : EMPTY);
      }
    }
    for (r = 1; r < ROWS - 1; r++) {
      for (var c2 = 1; c2 < COLS - 1; c2++) {
        if (grid[r][c2] !== EMPTY) continue;
        if ((r === 1 && c2 === 1) || (r === 1 && c2 === 2) || (r === 2 && c2 === 1)) continue;
        if (rng() < SOFT_DENSITY) grid[r][c2] = SOFT;
      }
    }
  }

  function spawnEnemies() {
    enemies = [];
    var candidates = [];
    for (var r = 1; r < ROWS - 1; r++) {
      for (var c = 1; c < COLS - 1; c++) {
        if (grid[r][c] === EMPTY && manhattan(c, r) >= ENEMY_MIN_DIST) candidates.push({ col: c, row: r });
      }
    }
    var dirs = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
    for (var i = 0; i < ENEMY_COUNT && candidates.length; i++) {
      var pick = Math.floor(rng() * candidates.length);
      var t = candidates.splice(pick, 1)[0];
      var center = tileCenter(t.col, t.row);
      var d = dirs[Math.floor(rng() * 4)];
      enemies.push({ x: center.x, y: center.y, dx: d.dx, dy: d.dy });
    }
  }

  var INVULN_FRAMES = 120;

  function reset(seed) {
    srand(seed);
    buildGrid();
    var c = tileCenter(1, 1);
    player = { x: c.x, y: c.y, invuln: 0 };
    bombs = []; blasts = []; powerups = [];
    lives = START_LIVES; bombCap = START_CAP; range = START_RANGE;
    spawnEnemies();
    phase = 'playing';
    keys = {};
  }

  // ---------- collision ----------
  function boxOverlapsTile(x, y, half, col, row) {
    return x + half > col * TILE && x - half < (col + 1) * TILE &&
           y + half > row * TILE && y - half < (row + 1) * TILE;
  }

  function solidForPlayer(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
    if (grid[row][col] !== EMPTY) return true;
    for (var i = 0; i < bombs.length; i++) {
      if (bombs[i].solid && bombs[i].col === col && bombs[i].row === row) return true;
    }
    return false;
  }

  function solidForEnemy(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
    if (grid[row][col] !== EMPTY) return true;
    for (var i = 0; i < bombs.length; i++) {
      if (bombs[i].col === col && bombs[i].row === row) return true;
    }
    return false;
  }

  function boxBlocked(x, y, half, solidFn) {
    var minC = Math.floor((x - half) / TILE), maxC = Math.floor((x + half - 0.001) / TILE);
    var minR = Math.floor((y - half) / TILE), maxR = Math.floor((y + half - 0.001) / TILE);
    for (var r = minR; r <= maxR; r++) {
      for (var c = minC; c <= maxC; c++) {
        if (solidFn(c, r)) return true;
      }
    }
    return false;
  }

  // ---------- bombs & blasts ----------
  function placeBomb() {
    var t = tileOf(player.x, player.y);
    var own = 0;
    for (var i = 0; i < bombs.length; i++) {
      if (bombs[i].col === t.col && bombs[i].row === t.row) return;
      own++;
    }
    if (own >= bombCap) return;
    bombs.push({ col: t.col, row: t.row, fuse: BOMB_FUSE, solid: false });
  }

  function detonate(bomb) {
    var tiles = [{ col: bomb.col, row: bomb.row, soft: false }];
    var dirs = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
    for (var d = 0; d < 4; d++) {
      for (var step = 1; step <= range; step++) {
        var c = bomb.col + dirs[d].dx * step, r = bomb.row + dirs[d].dy * step;
        if (c < 0 || r < 0 || c >= COLS || r >= ROWS) break;
        if (grid[r][c] === HARD) break;
        if (grid[r][c] === SOFT) { tiles.push({ col: c, row: r, soft: true }); break; }
        tiles.push({ col: c, row: r, soft: false });
      }
    }
    blasts.push({ tiles: tiles, timer: BLAST_FRAMES });
  }

  function flameCovers(col, row) {
    for (var b = 0; b < blasts.length; b++) {
      for (var t = 0; t < blasts[b].tiles.length; t++) {
        if (blasts[b].tiles[t].col === col && blasts[b].tiles[t].row === row) return true;
      }
    }
    return false;
  }

  function hitPlayer() {
    if (player.invuln > 0) return;
    lives--;
    if (lives <= 0) { phase = 'gameover'; return; }
    var c = tileCenter(1, 1);
    player.x = c.x; player.y = c.y;
    player.invuln = INVULN_FRAMES;
  }

  // ---------- update ----------
  function update() {
    if (phase !== 'playing') return;

    // 0. invulnerability countdown
    if (player.invuln > 0) player.invuln--;

    // 1. fuse countdown → detonation (looped: flames covering another bomb chain-detonate it)
    for (var i = bombs.length - 1; i >= 0; i--) bombs[i].fuse--;
    var chained = true;
    while (chained) {
      chained = false;
      for (i = bombs.length - 1; i >= 0; i--) {
        if (bombs[i].fuse <= 0 || flameCovers(bombs[i].col, bombs[i].row)) {
          var b = bombs.splice(i, 1)[0];
          detonate(b);
          chained = true;
        }
      }
    }

    // 2. blast damage
    for (i = enemies.length - 1; i >= 0; i--) {
      var et = tileOf(enemies[i].x, enemies[i].y);
      if (flameCovers(et.col, et.row)) enemies.splice(i, 1);
    }
    if (enemies.length === 0) { phase = 'victory'; return; }
    for (var bi = 0; bi < blasts.length; bi++) {
      var hit = false;
      for (var ti = 0; ti < blasts[bi].tiles.length; ti++) {
        var ft = blasts[bi].tiles[ti];
        if (boxOverlapsTile(player.x, player.y, PLAYER_HALF, ft.col, ft.row)) { hit = true; break; }
      }
      if (hit) { hitPlayer(); if (phase !== 'playing') return; break; }
    }

    // 3. flame countdown → soft destruction & drops
    for (i = blasts.length - 1; i >= 0; i--) {
      blasts[i].timer--;
      if (blasts[i].timer <= 0) {
        var done = blasts.splice(i, 1)[0];
        for (ti = 0; ti < done.tiles.length; ti++) {
          var dt = done.tiles[ti];
          if (dt.soft && grid[dt.row][dt.col] === SOFT) {
            grid[dt.row][dt.col] = EMPTY;
            if (rng() < DROP_RATE) {
              powerups.push({ col: dt.col, row: dt.row, kind: rng() < 0.5 ? 'extra-bomb' : 'blast-range' });
            }
          }
        }
      }
    }

    // 4. player movement (axis-separated)
    var dx = (keys.ArrowRight ? PLAYER_SPEED : 0) - (keys.ArrowLeft ? PLAYER_SPEED : 0);
    var dy = (keys.ArrowDown ? PLAYER_SPEED : 0) - (keys.ArrowUp ? PLAYER_SPEED : 0);
    if (dx !== 0 && !boxBlocked(player.x + dx, player.y, PLAYER_HALF, solidForPlayer)) player.x += dx;
    if (dy !== 0 && !boxBlocked(player.x, player.y + dy, PLAYER_HALF, solidForPlayer)) player.y += dy;

    // 5. bomb solidification once the player leaves its tile
    for (i = 0; i < bombs.length; i++) {
      if (!bombs[i].solid && !boxOverlapsTile(player.x, player.y, PLAYER_HALF, bombs[i].col, bombs[i].row)) {
        bombs[i].solid = true;
      }
    }

    // 6. enemies: straight-line movement, random re-direction when blocked, contact kill
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      var nx = e.x + e.dx * ENEMY_SPEED, ny = e.y + e.dy * ENEMY_SPEED;
      if (boxBlocked(nx, ny, ENEMY_HALF, solidForEnemy)) {
        var d = Math.floor(rng() * 4);
        e.dx = [1, -1, 0, 0][d]; e.dy = [0, 0, 1, -1][d];
      } else {
        e.x = nx; e.y = ny;
      }
      if (Math.abs(e.x - player.x) < PLAYER_HALF + ENEMY_HALF &&
          Math.abs(e.y - player.y) < PLAYER_HALF + ENEMY_HALF) {
        hitPlayer();
        if (phase !== 'playing') return;
      }
    }

    // 7. power-up pickup
    for (i = powerups.length - 1; i >= 0; i--) {
      var p = powerups[i];
      if (boxOverlapsTile(player.x, player.y, PLAYER_HALF, p.col, p.row)) {
        if (p.kind === 'extra-bomb') bombCap++;
        else range++;
        powerups.splice(i, 1);
      }
    }
  }

  // ---------- input ----------
  function onPress(code) {
    if (code === 'Space' && phase === 'playing') placeBomb();
    if (code === 'KeyP' && (phase === 'playing' || phase === 'paused')) {
      phase = phase === 'playing' ? 'paused' : 'playing';
    }
    if (code === 'KeyR' && (phase === 'gameover' || phase === 'victory')) {
      reset(Math.floor(rng() * 2147483647));
    }
  }

  document.addEventListener('keydown', function (e) {
    if (!keys[e.code]) onPress(e.code);
    keys[e.code] = true;
    if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault();
  });
  document.addEventListener('keyup', function (e) { keys[e.code] = false; });

  // ---------- render ----------
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (grid[r][c] === HARD) { ctx.fillStyle = '#546e7a'; ctx.fillRect(c * TILE, r * TILE, TILE, TILE); }
        else if (grid[r][c] === SOFT) { ctx.fillStyle = '#a1887f'; ctx.fillRect(c * TILE + 2, r * TILE + 2, TILE - 4, TILE - 4); }
      }
    }
    var i;
    for (i = 0; i < powerups.length; i++) {
      ctx.fillStyle = powerups[i].kind === 'extra-bomb' ? '#ffca28' : '#ef5350';
      var pc = tileCenter(powerups[i].col, powerups[i].row);
      ctx.beginPath(); ctx.arc(pc.x, pc.y, 10, 0, Math.PI * 2); ctx.fill();
    }
    for (i = 0; i < bombs.length; i++) {
      var bc = tileCenter(bombs[i].col, bombs[i].row);
      ctx.fillStyle = '#212121';
      ctx.beginPath(); ctx.arc(bc.x, bc.y, 14, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,152,0,0.85)';
    for (i = 0; i < blasts.length; i++) {
      for (var t = 0; t < blasts[i].tiles.length; t++) {
        var ft = blasts[i].tiles[t];
        ctx.fillRect(ft.col * TILE + 3, ft.row * TILE + 3, TILE - 6, TILE - 6);
      }
    }
    for (i = 0; i < enemies.length; i++) {
      ctx.fillStyle = '#7e57c2';
      ctx.beginPath(); ctx.arc(enemies[i].x, enemies[i].y, ENEMY_HALF, 0, Math.PI * 2); ctx.fill();
    }
    // Respawn invulnerability reads as flashing (skip every other 8-frame window).
    if (player.invuln === 0 || player.invuln % 16 < 8) {
      ctx.fillStyle = '#fafafa';
      ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_HALF, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#eeeeee'; ctx.font = '16px monospace';
    ctx.fillText('Lives: ' + lives + '  Bombs: ' + bombCap + '  Range: ' + range +
                 '  Enemies: ' + enemies.length, 10, ROWS * TILE + 26);
    if (phase === 'paused') ctx.fillText('PAUSED — press P', 230, 260);
    if (phase === 'gameover') ctx.fillText('GAME OVER — press R', 210, 260);
    if (phase === 'victory') ctx.fillText('VICTORY — press R', 220, 260);
  }

  // ---------- loop ----------
  var last = 0, acc = 0, STEP = 1000 / 60;
  function frame(ts) {
    if (!last) last = ts;
    acc += ts - last; last = ts;
    if (acc > 250) acc = 250;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- test hook ----------
  window.__bomberman = {
    get state() {
      return {
        grid: grid, player: player, bombs: bombs, blasts: blasts, enemies: enemies,
        powerups: powerups, lives: lives, bombCap: bombCap, range: range,
        enemiesLeft: enemies.length, phase: phase,
      };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) update(); },
    pressKey: function (code) { if (!keys[code]) onPress(code); keys[code] = true; },
    releaseKey: function (code) { keys[code] = false; },
    reset: reset,
    render: render,
  };

  reset((Date.now ? Date.now() : 1) >>> 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
