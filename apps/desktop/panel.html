<!doctype html>
<html lang="zh-Hant" style="background: transparent">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speclink Tray Panel</title>
    <style>
      /* vibrancy 透出＋原生手感：背景透明、內容不可選取。捲動面收斂於面板
         中段容器（三段式版面）——body 不再捲動，rubber-band 防護隨捲動面
         移入中段（TrayPanel 的 overscroll-none）。 */
      html,
      body {
        background: transparent !important;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
    </style>
  </head>
  <body style="background: transparent">
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
