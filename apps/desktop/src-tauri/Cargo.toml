[package]
name = "speclink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speclink 本地桌面 app（情境 4）"

[lib]
name = "speclink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
speclink-desktop-core = { path = "../core" }
speclink-remote = { path = "../../../crates/speclink-remote" }
speclink-protocol = { path = "../../../crates/speclink-protocol" }
notify-debouncer-mini = "0.7.0"
ulid = { workspace = true }
# credential 唯一落點 OS Keychain（design 決策 2）：僅啟用 macOS/Windows 原生
# 後端——其他平台退 keyring 內建 mock，桌面支援面即 macOS Keychain／Windows
# Credential Manager。
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
speclink-server = { path = "../../../crates/speclink-server" }
speclink-store = { path = "../../../crates/speclink-store" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
chrono = { workspace = true }
tiny_http = "0.12"

# 面板樣式（tray-status-menu「面板樣式（macOS）」）僅 macOS：非 macOS 建置不攜入。
[target.'cfg(target_os = "macos")'.dependencies]
# 釘 commit（v2.1 分支 2026-07-16 快照）：git 相依的供應鏈衛生，升級須明改 rev。
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# 釘 0.6 與 tauri 內建 window effects 的同版共用——不同版本並存會重複連結 objc 類別符號。
window-vibrancy = "0.6"
