<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" role="img" aria-label="The embedded shape: the CLI and Speclink Desktop of an engineer use HTTP to reach one route of the host, and the Agent tool of the host calls directly; both reach the entry point of the host kit; the engine reads and writes the database of the host through three functions: list, read, and commit. Speclink supplies the host kit and the engine, and the other parts belong to the host">
  <title>The embedded shape: the CLI and Speclink Desktop of an engineer use HTTP to reach one route of the host, and the Agent tool of the host calls directly; both reach the entry point of the host kit; the engine reads and writes the database of the host through three functions: list, read, and commit. Speclink supplies the host kit and the engine, and the other parts belong to the host</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mk"/></marker>
    <marker id="arrow-gap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mk-gap"/></marker>
    <marker id="arrow-kit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mk-kit"/></marker>
  </defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .box { fill: #ffffff; stroke: #98a6a3; stroke-width: 1.25; }
  .host { fill: #edf0ef; stroke: #98a6a3; stroke-width: 1.25; }
  .kit { fill: #e9effb; stroke: #1f55c4; stroke-width: 1.5; }
  .eng { fill: #e2f1ee; stroke: #0b6b5f; stroke-width: 1.5; }
  .gap { fill: #fdefea; stroke: #b4371a; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .zone { fill: none; stroke: #98a6a3; stroke-width: 1; stroke-dasharray: 2 5; }
  .zl { font-size: 12px; fill: #5c6b68; font-weight: 500; }
  .t { font-size: 14px; font-weight: 700; fill: #17201f; text-anchor: middle; }
  .t13 { font-size: 13px; font-weight: 700; fill: #17201f; text-anchor: middle; }
  .t-kit { fill: #1f55c4; }
  .t-eng { fill: #0b6b5f; }
  .t-gap { fill: #b4371a; }
  .s { font-size: 12px; fill: #40504d; text-anchor: middle; }
  .lbl { font-size: 12px; fill: #40504d; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .start { text-anchor: start; }
  .end { text-anchor: end; }
  .l-gap { fill: #b4371a; font-weight: 700; }
  .l-kit { fill: #1f55c4; font-weight: 700; }
  .edge { fill: none; stroke: #40504d; stroke-width: 1.4; }
  .e-gap { fill: none; stroke: #b4371a; stroke-width: 1.6; stroke-dasharray: 6 4; }
  .e-kit { fill: none; stroke: #1f55c4; stroke-width: 2; }
  .mk { fill: #40504d; }
  .mk-gap { fill: #b4371a; }
  .mk-kit { fill: #1f55c4; }
  </style>
  <rect width="760" height="476" fill="#ffffff"/>
  <text class="zl" x="8" y="22">Engineer’s computer</text>
  <rect class="zone" x="6" y="32" width="140" height="132" rx="8"/>
  <text class="zl" x="172" y="22">Host (your system): its own backend process, accounts, and database</text>
  <rect class="zone" x="168" y="32" width="586" height="400" rx="8"/>
  <rect class="zone" x="376" y="46" width="162" height="286" rx="8"/>
  <text class="zl" x="386" y="66">From Speclink</text>
  <rect class="box" x="14" y="76" width="124" height="64" rx="6"/>
  <text class="t13" x="76" y="103">CLI</text>
  <text class="t13" x="76" y="124">Speclink Desktop</text>
  <rect class="host" x="182" y="76" width="136" height="64" rx="6"/>
  <text class="t" x="250" y="103">Host route</text>
  <text class="s" x="250" y="124">verifies the token</text>
  <rect class="host" x="182" y="176" width="136" height="60" rx="6"/>
  <text class="t" x="250" y="201">Host Agent tool</text>
  <text class="s" x="250" y="222">identity from host</text>
  <rect class="host" x="182" y="356" width="136" height="60" rx="6"/>
  <text class="t" x="250" y="381">Notifications</text>
  <text class="s" x="250" y="402">read the event table</text>
  <rect class="kit" x="384" y="76" width="146" height="64" rx="6"/>
  <text class="t t-kit" x="457" y="103">Host kit</text>
  <text class="s" x="457" y="124">two entry points</text>
  <rect class="eng" x="384" y="248" width="146" height="68" rx="6"/>
  <text class="t t-eng" x="457" y="277">Engine</text>
  <text class="s" x="457" y="298">runs the verbs</text>
  <rect class="host" x="602" y="248" width="140" height="68" rx="6"/>
  <text class="t" x="672" y="277">Store functions</text>
  <text class="s" x="672" y="298">list, read, commit</text>
  <rect class="host" x="602" y="356" width="140" height="60" rx="6"/>
  <text class="t" x="672" y="381">Host database</text>
  <text class="s" x="672" y="402">specs + event table</text>
  <path class="edge" d="M138 108 H178" marker-end="url(#arrow)"/>
  <text class="lbl" x="158" y="99">HTTP</text>
  <path class="edge" d="M318 96 H380" marker-end="url(#arrow)"/>
  <path class="edge" d="M318 206 H350 V124 H380" marker-end="url(#arrow)"/>
  <text class="lbl" x="349" y="74">request</text>
  <text class="lbl" x="349" y="88">+ identity</text>
  <text class="lbl" x="350" y="162">argv</text>
  <text class="lbl" x="350" y="176">+ identity</text>
  <path class="edge" d="M457 140 V244" marker-end="url(#arrow)"/>
  <text class="lbl start" x="466" y="198">command</text>
  <path class="edge" d="M530 282 H598" marker-end="url(#arrow)"/>
  <text class="lbl" x="564" y="273">calls</text>
  <path class="edge" d="M672 316 V352" marker-end="url(#arrow)"/>
  <text class="lbl end" x="662" y="339">one transaction</text>
  <path class="edge" d="M602 386 H322" marker-end="url(#arrow)"/>
  <text class="lbl" x="462" y="377">the host reads its event table</text>
  <rect class="box" x="8" y="447" width="22" height="14" rx="3"/>
  <text class="s start" x="38" y="459">Clients</text>
  <rect class="host" x="108" y="447" width="22" height="14" rx="3"/>
  <text class="s start" x="138" y="459">Belongs to the host</text>
  <rect class="kit" x="270" y="447" width="22" height="14" rx="3"/>
  <text class="s start" x="300" y="459">Host kit (from Speclink)</text>
  <rect class="eng" x="510" y="447" width="22" height="14" rx="3"/>
  <text class="s start" x="540" y="459">Engine (from Speclink)</text>
</svg>
