<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 166" width="760" role="img" aria-label="The contents of the SDK: the npm package @speclink/engine contains four things — the engine, the host kit, the store port contract, and the conformance tests">
  <title>The contents of the SDK: the npm package @speclink/engine contains four things — the engine, the host kit, the store port contract, and the conformance tests</title>
  <style>
